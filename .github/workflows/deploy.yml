name: Deploy stable

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: chmura-blokserwis-stable
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-stable:
    name: Validate and deploy stable
    runs-on: ubuntu-latest
    environment: production

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
      UNISOURCE_URL: ${{ secrets.UNISOURCE_URL }}
      UNISOURCE_SERVICE_ID: ${{ secrets.UNISOURCE_SERVICE_ID }}
      UNISOURCE_API_KEY: ${{ secrets.UNISOURCE_API_KEY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      PUBLIC_APPWRITE_ENDPOINT: ${{ secrets.PUBLIC_APPWRITE_ENDPOINT }}
      PUBLIC_APPWRITE_PROJECT_ID: ${{ secrets.PUBLIC_APPWRITE_PROJECT_ID }}
      PUBLIC_APPWRITE_PROJECT_NAME: Chmura Blokserwis
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check application
        run: pnpm check

      - name: Test unit
        run: pnpm exec vitest run

      - name: Report missing deployment credential
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Validation passed, but stable deployment is skipped until CLOUDFLARE_API_TOKEN is configured."

      - name: Build
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm build

      - name: Deploy stable
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: wrangler deploy

      - name: Smoke test stable
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --max-time 20 https://chmura.blokserwis.pl/ > /dev/null
