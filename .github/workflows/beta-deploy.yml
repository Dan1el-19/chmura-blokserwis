name: Deploy beta

on:
  workflow_dispatch:

concurrency:
  group: chmura-blokserwis-beta
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-beta:
    name: Validate and deploy beta
    runs-on: ubuntu-latest
    environment: beta

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Refuse main
        run: test "${GITHUB_REF_NAME}" != "main"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate beta isolation
        run: pnpm check:beta-config

      - name: Check application
        run: pnpm check

      - name: Test unit
        run: pnpm exec vitest run

      - name: Verify stable before deployment
        run: curl --fail --silent --show-error --max-time 20 https://chmura.blokserwis.pl/ > /dev/null

      - name: Deploy beta
        run: pnpm deploy:beta

      - name: Smoke test beta
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --max-time 20 https://beta.chmura.blokserwis.pl/ > /dev/null

      - name: Verify stable after deployment
        run: curl --fail --silent --show-error --max-time 20 https://chmura.blokserwis.pl/ > /dev/null
