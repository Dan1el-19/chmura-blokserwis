name: Deploy beta

on:
  workflow_dispatch:
  push:
    branches:
      - codex/unisource-v2-beta

concurrency:
  group: chmura-blokserwis-beta
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-beta:
    name: Validate and deploy beta
    runs-on: ubuntu-latest
    environment: beta

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
      UNISOURCE_URL: ${{ secrets.UNISOURCE_URL }}
      UNISOURCE_SERVICE_ID: ${{ secrets.UNISOURCE_SERVICE_ID }}
      UNISOURCE_API_KEY: ${{ secrets.UNISOURCE_API_KEY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      PUBLIC_APPWRITE_ENDPOINT: ${{ secrets.PUBLIC_APPWRITE_ENDPOINT }}
      PUBLIC_APPWRITE_PROJECT_ID: ${{ secrets.PUBLIC_APPWRITE_PROJECT_ID }}
      PUBLIC_APPWRITE_PROJECT_NAME: Chmura Blokserwis Beta
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Refuse main
        run: test "${GITHUB_REF_NAME}" != "main"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate beta isolation
        run: pnpm check:beta-config

      - name: Check application
        run: pnpm check

      - name: Test unit
        run: pnpm exec vitest run

      - name: Report missing deployment credential
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Validation passed, but beta deployment is skipped until CLOUDFLARE_API_TOKEN is configured."

      - name: Verify stable before deployment
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: curl --fail --silent --show-error --max-time 20 https://chmura.blokserwis.pl/ > /dev/null

      - name: Render beta runtime secrets
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: node scripts/render-beta-secrets.mjs > "$RUNNER_TEMP/beta-secrets.json"

      - name: Deploy beta
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm deploy:beta:ci

      - name: Remove rendered beta runtime secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/beta-secrets.json"

      - name: Smoke test beta
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --max-time 20 https://beta.chmura.blokserwis.pl/ > /dev/null

      - name: Verify stable after deployment
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: curl --fail --silent --show-error --max-time 20 https://chmura.blokserwis.pl/ > /dev/null
