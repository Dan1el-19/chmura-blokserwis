<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kreator wyceny — prototyp</title>
<style>
:root{font:16px/1.5 system-ui,sans-serif;color:#202936;background:#f5f6f8;--line:#dce1e7;--muted:#647184;--primary:#2d57b3}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button,.button{min-height:44px;border:1px solid var(--line);border-radius:7px;padding:10px 16px;background:white;cursor:pointer;color:inherit}button:hover,.button:hover{background:#f3f5f8}button:disabled{opacity:.5;cursor:default}.primary{background:var(--primary);color:white;border-color:var(--primary)}.primary:hover{background:#234790}a{color:var(--primary)}:focus-visible{outline:3px solid #6a94ea;outline-offset:3px}main{max-width:1320px;margin:auto;padding:20px 28px 100px;min-width:0}.prototype{background:#eaf0fc;border-bottom:1px solid #c9d5f1;padding:10px 24px;font-size:13px;text-align:center}.back{display:inline-flex;align-items:center;min-height:44px;text-decoration:none;color:var(--muted)}nav ol{list-style:none;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}nav li{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--line);padding:12px 0;color:var(--muted);font-size:13px}nav li[aria-current]{border-color:var(--primary);font-weight:600;color:#202936}.number{flex:none;display:grid;place-items:center;width:28px;height:28px;border:1px solid var(--line);border-radius:50%}li[aria-current] .number{background:var(--primary);border-color:var(--primary);color:white}h1{font-size:28px;line-height:1.25;margin:8px 0 12px}h2{font-size:18px;margin:0}h3{font-size:15px;margin:0}p{margin:0 0 16px}.muted{color:var(--muted);font-size:14px}.panel{background:white;border:1px solid var(--line);border-radius:10px;padding:24px;min-width:0}.stack{display:grid;gap:20px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}label{display:grid;gap:6px;font-size:14px}input,textarea{border:1px solid var(--line);border-radius:6px;padding:11px;min-width:0;max-width:100%;width:100%;background:#fff}textarea{resize:vertical}details{border-top:1px solid var(--line);margin-top:24px;padding-top:12px}summary{min-height:44px;padding:10px 0;cursor:pointer;font-size:14px}.import{max-width:760px}.import input{margin:8px 0 14px}.review-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:20px 0}dl{margin:0}dt{font-size:13px;color:var(--muted)}dd{margin:4px 0;font-weight:500;overflow-wrap:anywhere}.lines{list-style:none;padding:0;margin:0}.lines li{display:grid;grid-template-columns:minmax(0,1fr) 80px 100px 110px;gap:12px;padding:16px 0;border-top:1px solid var(--line);align-items:start;font-size:14px}.lines strong{display:block}.line-price{text-align:right}.scope{border-top:1px solid var(--line);padding-top:16px}.bottom{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap;margin-top:20px}.status{font-size:14px;color:var(--muted)}.workspace{container-type:inline-size}.edit-grid{display:grid;gap:20px}.tabs{display:flex;gap:10px;margin-bottom:16px}.tabs button[aria-selected=true]{border-color:var(--primary);color:var(--primary)}.assistant{display:grid;align-content:start;gap:16px}.message{padding:16px;background:#f5f7fa;border:1px solid var(--line);border-radius:8px;font-size:14px}.user{background:#edf2fc}.proposal{padding:16px;border:1px solid #b6c6ea;border-radius:8px}.proposal p{font-size:14px}.activity{padding-left:20px;font-size:14px}.activity li{margin:8px 0}.notice{border-left:3px solid var(--primary);padding:12px 16px;background:#edf2fc;font-size:14px}.pdf-viewport{overflow:auto;background:#e8ebef;padding:16px;max-height:74vh;min-width:0;border:1px solid var(--line);border-radius:7px}.paper-wrap{margin:auto;position:relative}.paper{width:794px;min-height:1123px;background:white;transform-origin:top left;padding:68px 68px 80px;position:relative;color:#222;font-family:Arial,sans-serif;font-size:13px}.brand{font-size:24px;font-weight:700;letter-spacing:2px;color:#2d57b3}.paper-header{display:flex;justify-content:space-between;border-bottom:2px solid #2d57b3;padding-bottom:20px;margin-bottom:28px}.paper h2{font-size:22px;margin:28px 0}.paper table{width:100%;border-collapse:collapse;margin:22px 0}.paper th,.paper td{text-align:left;border-bottom:1px solid #ddd;padding:12px 6px;font-size:12px}.paper th{background:#f2f4f7}.paper .sum{text-align:right;font-size:18px;font-weight:bold}.footer{position:absolute;bottom:42px;left:68px;right:68px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;border-top:1px solid #ddd;padding-top:14px;font-size:10px;color:#666}.success{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#e8f4eb;color:#25643a;font-size:25px;margin-bottom:16px}.summary{max-width:760px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar button{font-size:13px;padding:8px 12px}.scope p{font-size:14px;margin:8px 0}#announcement:empty{display:none}@container(min-width:1100px){.edit-grid{grid-template-columns:minmax(0,1fr) minmax(340px,.65fr)}.tabs{display:none}.edit-grid .pane{display:block!important}}@media(max-width:600px){main{padding:12px 16px 84px}.prototype{padding:8px 16px}h1{font-size:25px}.panel{padding:16px}.step-label{display:none}nav li{justify-content:center}nav ol{gap:6px}.fields,.review-grid{grid-template-columns:1fr}.lines li{grid-template-columns:minmax(0,1fr) auto;gap:8px}.lines .line-name{grid-column:1/-1}.lines .line-quantity{color:var(--muted)}.lines .line-price:last-child{grid-column:2}.bottom{justify-content:stretch}.bottom button{flex:1 1 auto}.pdf-viewport{padding:8px}.row.between{align-items:flex-start}.review-grid{gap:10px}dd{margin-top:0}nav{margin-bottom:20px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="prototype">Prototyp interakcji · dane przykładowe · AI, zapis i PDF są symulowane lokalnie</div>
<main><a class="back" href="#import">← Wyceny</a><nav aria-label="Etapy wyceny"><ol id="steps"></ol></nav><header><p class="muted" id="counter"></p><h1 id="title"></h1><p class="muted" id="subtitle"></p></header><div id="screen"></div><p id="announcement" class="status" role="status" aria-live="polite"></p></main>
<script>
const stages=['import','review','agent','preview','summary'];
const labels=['Import danych','Sprawdź dane','Asystent AI','Podgląd PDF','Podsumowanie'];
const subtitles=['Wybierz arkusz z pozycjami i cenami, aby rozpocząć wycenę.','Sprawdź dane klienta i pozycje przed przygotowaniem dokumentu.','Opracuj opisy i zakres. Każdą propozycję zaakceptujesz przed zapisem.','Obejrzyj cały dokument przed zatwierdzeniem.','Pobierz gotowy dokument lub przygotuj kolejną rewizję.'];
let data={title:'Kontrola dostępu — wejście główne',client:'Wspólnota przy ul. Przykładowej 12',date:'2026-11-16',name:'Zwora 600 SL',description:'',scope:'Montaż systemu kontroli dostępu przy wejściu głównym.'};
let version=1,viewed=0,approved=false,editing=false,aiChoice=null,aiRuns=0,proposal=false,accepted=false,tab='data',source='';
const screen=document.getElementById('screen');
const escape=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function announce(text){document.getElementById('announcement').textContent=text}
function go(stage){editing=false;location.hash=stage}
function stage(){const value=location.hash.slice(1);return stages.includes(value)?value:'import'}
function lines(){return `<ul class="lines"><li><div class="line-name"><strong>${escape(data.name)}</strong>${data.description?`<span class="muted">${escape(data.description)}</span>`:''}</div><span class="line-quantity">2 szt.</span><span class="line-price">330,00 zł</span><strong class="line-price">660,00 zł</strong></li><li><div class="line-name"><strong>Montaż i uruchomienie</strong></div><span class="line-quantity">1 usł.</span><span class="line-price">550,00 zł</span><strong class="line-price">550,00 zł</strong></li></ul>`}
function review(){return `<section class="panel"><div class="row between"><h2>${escape(data.title)}</h2><button onclick="edit()">Edytuj dane</button></div><div class="review-grid"><dl><dt>Klient</dt><dd>${escape(data.client)}</dd></dl><dl><dt>Data dokumentu</dt><dd>${escape(data.date)}</dd></dl><dl><dt>Ceny</dt><dd>Brutto · PLN</dd></dl></div><h3>Pozycje wyceny</h3>${lines()}<p style="text-align:right;margin:16px 0 0"><strong>Razem brutto: 1 210,00 zł</strong></p></section>`}
function aiPanel(){return `<section class="panel assistant"><h2>Asystent AI</h2><p class="muted">Nazwy, opisy i zakres. Ilości, ceny i sumy pozostają bez zmian.</p>${aiRuns?`<div class="message">Przygotowano opisy na podstawie danych wyceny. Model urządzenia nie został potwierdzony w źródłach zewnętrznych.</div>`:'<div class="message">Mogę uporządkować nazwy i opisać potwierdzony zakres. Rozpocznij, gdy dane będą gotowe.</div>'}${proposal?`<div class="proposal"><h3>Propozycja do sprawdzenia</h3><p><strong>Zwora elektromagnetyczna 600 SL</strong><br>Element ryglujący wejście w systemie kontroli dostępu. Oznaczenie zachowane z arkusza.</p><p>Zakres: montaż urządzeń i uruchomienie kontroli dostępu przy wejściu głównym.</p><div class="row"><button class="primary" onclick="applyProposal()">Zastosuj propozycję</button><button onclick="proposal=false;render()">Odrzuć</button></div></div>`:''}<div class="notice">To symulacja prototypu. Nie wykonano wyszukiwania ani płatnego wywołania AI.</div><label>Wiadomość do asystenta<textarea id="prompt" rows="3" placeholder="Np. skróć opis i doprecyzuj zakres montażu"></textarea></label><button onclick="runAI()">${aiRuns?'Wyślij prośbę o poprawki':'Przygotuj propozycję AI'}</button><p class="status">${aiRuns?`Zakończone tury: ${aiRuns}`:'AI jeszcze nie uruchomiono.'}</p></section>`}
function editingView(){return `<div class="workspace"><div class="tabs" role="tablist" aria-label="Widok edycji"><button role="tab" aria-selected="${tab==='data'}" onclick="setTab('data')">Dane wyceny</button><button role="tab" aria-selected="${tab==='ai'}" onclick="setTab('ai')">Asystent AI</button></div><div class="edit-grid"><section class="panel pane" style="display:${tab==='data'?'block':'none'}"><h2>Dane wyceny</h2><div class="fields" style="margin:20px 0"><label>Tytuł<input id="edit-title" value="${escape(data.title)}" oninput="update('title',this.value)"></label><label>Klient<input value="${escape(data.client)}" oninput="update('client',this.value)"></label><label>Data dokumentu<input type="date" value="${escape(data.date)}" oninput="update('date',this.value)"></label></div><h3>Pozycje</h3>${lines()}<label style="margin:20px 0">Zakres prac<textarea rows="4" oninput="update('scope',this.value)">${escape(data.scope)}</textarea></label><p class="status" id="save-status">Zapisano szkic · wersja ${version}</p></section><div class="pane" style="display:${tab==='ai'?'block':'none'}">${aiPanel()}</div></div><div class="bottom"><button class="primary" onclick="finishEdit()">Zapisz i wróć do podglądu</button></div></div>`}
function render(){const current=stage(),index=stages.indexOf(current);document.getElementById('steps').innerHTML=stages.map((s,i)=>`<li ${s===current?'aria-current="step"':''}><span class="number" aria-hidden="true">${i+1}</span><span class="step-label">${labels[i]}</span></li>`).join('');document.getElementById('counter').textContent=`Krok ${index+1} z 5${approved?' · W/001/2026':''}`;document.getElementById('title').textContent=editing?'Edytuj wycenę':labels[index];document.getElementById('subtitle').textContent=editing?'Dane i rozmowa pozostają dostępne po przełączeniu widoku.':subtitles[index];if(editing){screen.innerHTML=editingView();return}
if(current==='import'){screen.innerHTML=`<section class="panel import"><h2>Import z arkusza XLSX</h2><p class="muted" style="margin-top:8px">Po wyborze pliku powstanie szkic. Rozpoznane pozycje najpierw pokażemy do sprawdzenia.</p><label>Plik XLSX<input type="file" accept=".xlsx" onchange="selectFile(this)"></label><button class="primary" onclick="source='Przykładowy arkusz.xlsx';go('review')">Wypróbuj przykładowy arkusz</button><details><summary>Opcje zaawansowane</summary><p class="muted">Rozpocznij bez arkusza i dodaj dane ręcznie.</p><button onclick="beginManual()">Wprowadź dane ręcznie</button></details></section>`}
if(current==='review'){screen.innerHTML=`<div class="stack">${source?`<p class="status">Źródło: ${escape(source)} · dane przykładowe prototypu</p>`:''}${review()}<section class="panel"><h2>Czy chcesz skorzystać z AI?</h2><p class="muted" style="margin-top:8px">Asystent może uporządkować nazwy, opisy i zakres. Kwoty pozostaną bez zmian.</p><div class="row"><button class="primary" onclick="aiChoice=true;go('agent')">Tak, przygotuj opisy z AI</button><button onclick="aiChoice=false;go('preview')">Nie, przejdź do PDF</button></div></section></div>`}
if(current==='agent'){screen.innerHTML=`<div class="stack">${aiPanel()}<div class="bottom"><button onclick="go('review')">Wróć do danych</button><button class="primary" onclick="go('preview')">Przejdź do podglądu PDF</button></div></div>`}
if(current==='preview'){viewed=version;screen.innerHTML=`<div class="toolbar"><button onclick="fitPDF()">Dopasuj do szerokości</button><button onclick="zoomPDF()">100%</button><span class="status">Aktualny PDF · wersja ${version}</span></div><div class="pdf-viewport" id="pdf-viewport"><div class="paper-wrap" id="paper-wrap"><article class="paper" id="paper"><div class="paper-header"><div class="brand">BLOKSERWIS</div><div>Wycena ${approved?'W/001/2026':'— szkic'}<br>${escape(data.date)}</div></div><div class="muted">DLA</div><strong>${escape(data.client)}</strong><h2>${escape(data.title)}</h2><h3>Zestawienie kosztów</h3><table><thead><tr><th>Pozycja</th><th>Ilość</th><th>Cena brutto</th><th>Wartość brutto</th></tr></thead><tbody><tr><td><strong>${escape(data.name)}</strong><br>${escape(data.description)}</td><td>2 szt.</td><td>330,00 zł</td><td>660,00 zł</td></tr><tr><td>Montaż i uruchomienie</td><td>1 usł.</td><td>550,00 zł</td><td>550,00 zł</td></tr></tbody></table><p class="sum">Razem brutto: 1 210,00 zł</p><h3 style="margin-top:32px">Zakres prac</h3><p style="margin-top:12px">${escape(data.scope)}</p><div class="footer"><div>BLOKSERWIS<br>Dane przykładowe prototypu</div><div>Kontakt<br>biuro@example.test</div><div>Wycena · ${escape(data.date)}<br>Strona 1 z 1</div></div></article></div></div><div class="bottom"><button onclick="edit()">Edytuj wycenę</button><button class="primary" onclick="approve()">${approved?'Zatwierdź rewizję':'Zatwierdź wycenę'}</button></div>`;requestAnimationFrame(fitPDF)}
if(current==='summary'){screen.innerHTML=approved?`<section class="panel summary"><div class="success" aria-hidden="true">✓</div><h2>Wycena W/001/2026 zatwierdzona</h2><p class="muted" style="margin-top:8px">${escape(data.title)} · ${escape(data.client)}</p><div class="review-grid"><dl><dt>Wartość brutto</dt><dd>1 210,00 zł</dd></dl><dl><dt>Data dokumentu</dt><dd>${escape(data.date)}</dd></dl><dl><dt>PDF</dt><dd>Gotowy</dd></dl></div><div class="row"><button class="primary" onclick="announce('Pobranie PDF jest symulowane w prototypie.')">Pobierz PDF</button><button onclick="go('preview')">Pokaż dokument</button><button onclick="edit()">Edytuj i utwórz rewizję</button></div></section>`:`<section class="panel"><h2>Wycena wymaga zatwierdzenia</h2><p class="muted">Najpierw obejrzyj aktualny dokument.</p><button class="primary" onclick="go('preview')">Otwórz podgląd PDF</button></section>`}}
function beginManual(){source='Dane ręczne';history.pushState(null,'','#review');editing=true;render()}
function selectFile(input){const file=input.files[0];if(!file)return;if(!file.name.toLowerCase().endsWith('.xlsx')){announce('Wybierz plik XLSX.');return}source=file.name;go('review')}
function edit(){editing=true;tab='data';render();document.getElementById('edit-title').focus()}
function setTab(value){tab=value;render()}
function update(key,value){data[key]=value;version++;const status=document.getElementById('save-status');if(status)status.textContent=`Zapisano szkic · wersja ${version}`}
function finishEdit(){editing=false;if(stage()==='preview')render();else go('preview')}
function runAI(){aiRuns++;proposal=true;render();announce('Propozycja gotowa do sprawdzenia. Nie została jeszcze zastosowana.')}
function applyProposal(){data.name='Zwora elektromagnetyczna 600 SL';data.description='Element ryglujący wejście w systemie kontroli dostępu. Oznaczenie zachowane z arkusza.';data.scope='Montaż urządzeń i uruchomienie kontroli dostępu przy wejściu głównym.';version++;proposal=false;accepted=true;render();announce('Zastosowano propozycję. Ilości, ceny i sumy pozostały bez zmian.')}
function approve(){if(viewed!==version){announce('Obejrzyj aktualną wersję PDF.');return}approved=true;go('summary')}
function fitPDF(){const viewport=document.getElementById('pdf-viewport'),paper=document.getElementById('paper'),wrap=document.getElementById('paper-wrap');if(!viewport)return;const scale=Math.min(1,(viewport.clientWidth-32)/794);paper.style.transform=`scale(${scale})`;wrap.style.width=`${794*scale}px`;wrap.style.height=`${1123*scale}px`}
function zoomPDF(){const paper=document.getElementById('paper'),wrap=document.getElementById('paper-wrap');paper.style.transform='scale(1)';wrap.style.width='794px';wrap.style.height='1123px'}
addEventListener('hashchange',()=>{editing=false;render();announce('')});addEventListener('resize',fitPDF);render();
</script>
</body></html>
